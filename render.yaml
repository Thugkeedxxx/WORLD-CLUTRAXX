services:
  - type: web
    name: world-clutra888
    runtime: node
    plan: starter

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: ADMIN_PASSWORD
        generateValue: true

    disk:
      name: world-clutra888-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1